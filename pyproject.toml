[project]
name = "livedbg-mcp"
version = "0.1.0"
description = "Live C++ process debugging MCP server (cdb + DIA, PDB-aware, Unreal natvis add-on)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lagooneng", email = "hyunwoo122490@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.17",
    "mcp[cli]>=2.2.0",
]

[project.scripts]
livedbg-mcp = "livedbg_mcp:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
